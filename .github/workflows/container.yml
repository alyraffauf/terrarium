name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
      go_image: ${{ steps.projects.outputs.go_image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: projects
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          projects = sorted(path.parent.name for path in Path('.').glob('*/Dockerfile'))
          builders = {Path(project, 'Dockerfile').read_text().splitlines()[0].split()[1] for project in projects}
          if len(builders) != 1:
              raise SystemExit('daemon Dockerfiles must use the same Go builder')
          builder, suffix, _ = builders.pop().partition('-alpine')
          if not suffix or not builder.startswith('golang:'):
              raise SystemExit('expected golang:<version>-alpine build image')
          print('go_image=' + builder)
          print('projects=' + json.dumps(projects))
          PY

  test:
    runs-on: ubuntu-latest
    needs: discover
    container: ${{ needs.discover.outputs.go_image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: go test -race ./...
      - run: FUZZTIME=3s ./scripts/fuzz.sh
      - run: go vet ./...
      - run: go build -buildvcs=false ./cmd/...

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.24.2
      - run: nix flake check
      - run: nix develop -c sh scripts/test-charts.sh
      - name: Verify generated code
        run: |
          nix develop -c ./capensis/scripts/generate-db.sh
          nix develop -c ./helix/scripts/generate-db.sh
          nix develop -c ./palustre/microcosm/generate.sh
          git diff --exit-code -- capensis/storage helix/storage palustre/microcosm

  containers:
    needs: [discover, test, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.project }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.project }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.project }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}
